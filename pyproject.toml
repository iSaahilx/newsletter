[project]
name = "personal-intelligence-system"
version = "0.1.0"
description = "Daily AI, technology, science, markets, and research intelligence brief generator."
requires-python = ">=3.11"
dependencies = [
  "beautifulsoup4>=4.12.3",
  "feedparser>=6.0.11",
  "httpx>=0.27.2",
  "jinja2>=3.1.4",
  "openai>=1.54.0",
  "pydantic>=2.9.2",
  "python-dotenv>=1.0.1",
  "pyyaml>=6.0.2",
  "rich>=13.9.2",
  "typer>=0.12.5",
]

[project.scripts]
intel = "intelligence.cli:app"

[tool.setuptools.packages.find]
include = ["intelligence*"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.pyright]
pythonVersion = "3.11"
typeCheckingMode = "basic"
